<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Full-Stack E-Commerce & Blog Hub</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
  <!-- Navigation Header -->
  <header>
    <nav class="navbar">
      <div class="logo"><i class="fas fa-layer-group"></i> DevPortal</div>
      <div class="tab-controls">
        <button id="tab-shop" class="tab-btn active"><i class="fas fa-shopping-bag"></i> E-Commerce</button>
        <button id="tab-blog" class="tab-btn"><i class="fas fa-newspaper"></i> Blog Platform</button>
      </div>
      <div class="nav-right">
        <button id="cart-toggle-btn" class="cart-btn" aria-label="Cart">
          <i class="fas fa-shopping-cart"></i>
          <span id="cart-count" class="cart-badge">0</span>
        </button>
      </div>
    </nav>
  </header>

  <main class="main-container">
    <!-- SECTION 1: E-COMMERCE -->
    <section id="shop-view" class="view-panel active">
      <div class="view-header">
        <div>
          <h2>Product Catalog</h2>
          <p class="subtitle">Browse available products and add items to your cart</p>
        </div>
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" id="product-search" placeholder="Search by title or category..." />
        </div>
      </div>
      <div id="product-grid" class="product-grid">
        <!-- Injected via JavaScript -->
      </div>
    </section>

    <!-- SECTION 2: BLOG PLATFORM -->
    <section id="blog-view" class="view-panel">
      <div class="view-header">
        <div>
          <h2>Developer Community Blog</h2>
          <p class="subtitle">Read stories and publish posts</p>
        </div>
        <div class="blog-actions">
          <input type="text" id="author-filter" placeholder="Filter by author name..." />
          <button id="open-post-modal" class="btn-primary"><i class="fas fa-pen"></i> New Post</button>
        </div>
      </div>
      <div id="blog-posts-grid" class="blog-grid">
        <!-- Injected via JavaScript -->
      </div>
    </section>
  </main>

  <!-- CART SLIDE-OVER SIDEBAR -->
  <div id="cart-drawer" class="cart-drawer">
    <div class="cart-header">
      <h3><i class="fas fa-shopping-cart"></i> Your Cart</h3>
      <button id="close-cart-btn" class="close-btn">&times;</button>
    </div>
    <div id="cart-items" class="cart-items">
      <p class="empty-cart-text">Your cart is currently empty.</p>
    </div>
    <div class="cart-footer">
      <div class="cart-total-row">
        <span>Total:</span>
        <span id="cart-total-price">$0.00</span>
      </div>
      <button id="checkout-btn" class="btn-primary full-width">Proceed to Checkout</button>
    </div>
  </div>
  <div id="cart-overlay" class="cart-overlay"></div>

  <!-- CHECKOUT MODAL -->
  <div id="checkout-modal" class="modal">
    <div class="modal-content">
      <span id="close-checkout" class="close-modal">&times;</span>
      <h3>Complete Your Order</h3>
      <form id="checkout-form">
        <label>Full Name</label>
        <input type="text" id="cust-name" required placeholder="John Doe" />
        <label>Email Address</label>
        <input type="email" id="cust-email" required placeholder="john@example.com" />
        <button type="submit" class="btn-primary full-width mt-1">Confirm Order</button>
      </form>
    </div>
  </div>

  <!-- CREATE BLOG POST MODAL -->
  <div id="post-modal" class="modal">
    <div class="modal-content">
      <span id="close-post-modal" class="close-modal">&times;</span>
      <h3>Create a New Blog Post</h3>
      <form id="post-form">
        <label>Post Title</label>
        <input type="text" id="post-title" required minlength="3" placeholder="Understanding Full-Stack MERN" />
        <label>Author Name</label>
        <input type="text" id="post-author" required placeholder="Alex Turner" />
        <label>Category</label>
        <input type="text" id="post-category" placeholder="Web Development" />
        <label>Content</label>
        <textarea id="post-content" rows="6" required minlength="10" placeholder="Write your post here..."></textarea>
        <button type="submit" class="btn-primary full-width mt-1">Publish Post</button>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
